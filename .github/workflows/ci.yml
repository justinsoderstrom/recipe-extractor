name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Use recorded npm version
        run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore tests/api/RecipeExtractor.Api.Tests.csproj --locked-mode
      - run: dotnet format src/api/RecipeExtractor.Api.csproj --verify-no-changes --no-restore
      - run: dotnet format tests/api/RecipeExtractor.Api.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet build tests/api/RecipeExtractor.Api.Tests.csproj --configuration Release --no-restore
      - run: dotnet test --project tests/api/RecipeExtractor.Api.Tests.csproj --configuration Release --no-build --no-restore
